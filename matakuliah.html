<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mata Kuliah - SiAkad Lite</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar sama seperti dashboard (salin dari dashboard.html) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html">🎓 SiAkad Lite</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="matakuliah.html">Mata Kuliah</a></li>
          <li class="nav-item"><a class="nav-link" href="form-data.html">Data Saya</a></li>
        </ul>
        <a href="index.html" class="btn btn-outline-light btn-sm">Keluar</a>
      </div>
    </div>
  </nav>

  <div class="container mt-4">

    <h4 class="mb-1">Daftar Mata Kuliah</h4>
    <p class="text-muted mb-4">Semester Ganjil 2024/2025</p>

    <!-- Tombol filter -->
    <div class="mb-3" id="grupFilter">
      <!-- Tombol untuk filter data — akan dikontrol JavaScript -->
      <button class="btn btn-primary btn-sm me-2" data-filter="semua">Semua</button>
      <!-- data-filter: atribut kustom untuk menyimpan nilai filter -->
      <!-- JavaScript akan membaca nilai atribut ini -->
      <button class="btn btn-outline-success btn-sm me-2" data-filter="lulus">Lulus</button>
      <button class="btn btn-outline-warning btn-sm" data-filter="proses">Sedang Diambil</button>
    </div>

    <!-- Tabel mata kuliah -->
    <div class="table-responsive">
      <table class="table table-bordered table-hover">
        <!-- table-bordered: tampilkan garis batas pada semua sel -->
        <thead class="table-primary">
          <!-- table-primary: kepala tabel dengan background biru muda -->
          <tr>
            <th>Kode MK</th>
            <th>Nama Mata Kuliah</th>
            <th>SKS</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelMatkul">
          <!-- Akan diisi JavaScript -->
        </tbody>
      </table>
    </div>

  </div>

  <!-- ===== MODAL DETAIL MATA KULIAH ===== -->
  <!-- Modal adalah jendela popup yang muncul di atas halaman -->
  <div class="modal fade" id="modalDetail" tabindex="-1">
    <!-- modal: class dasar Bootstrap untuk modal -->
    <!-- fade: efek memudar saat modal muncul/hilang -->
    <!-- id="modalDetail": ID yang digunakan untuk membuka modal ini -->
    <!-- tabindex="-1": pengaturan aksesibilitas keyboard -->

    <div class="modal-dialog">
      <!-- modal-dialog: kotak dialog dalam modal -->

      <div class="modal-content">
        <!-- modal-content: area putih isi modal -->

        <div class="modal-header">
          <!-- modal-header: bagian atas modal -->
          <h5 class="modal-title" id="judulModal">Detail Mata Kuliah</h5>
          <!-- modal-title: judul modal -->
          <!-- id="judulModal": akan diubah JavaScript sesuai MK yang diklik -->

          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          <!-- btn-close: tombol X untuk menutup modal -->
          <!-- data-bs-dismiss="modal": perintah Bootstrap untuk menutup modal terdekat -->
        </div>

        <div class="modal-body" id="isiModal">
          <!-- modal-body: area konten modal -->
          <!-- id="isiModal": akan diisi JavaScript -->
        </div>

        <div class="modal-footer">
          <!-- modal-footer: bagian bawah modal (biasanya berisi tombol) -->
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
        </div>

      </div>
    </div>
  </div>
  <!-- Akhir modal -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>

</body>
</html>
